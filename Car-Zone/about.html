<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About | Car Zone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"
          >CAR <span>ZONE</span></a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
          aria-controls="menu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cars.html">Cars</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="gallery.html">Gallery</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About & Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main>
      <section class="container py-5">
        <h1>About Car Zone</h1>
        <p>
          Car Zone is a beginner-friendly website where visitors can discover
          cars and save their own collection.
        </p>
        <h2>What we offer</h2>
        <ul>
          <li>Featured cars</li>
          <li>Photo gallery</li>
          <li>Personal car management</li>
        </ul>
        <h2 class="mt-5">Contact Us</h2>
        <form id="contactForm" class="panel p-4 col-lg-7">
          <div class="mb-3">
            <label class="form-label" for="contactName">Name</label
            ><input id="contactName" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="contactEmail">Email</label
            ><input
              type="email"
              id="contactEmail"
              class="form-control"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="contactMessage">Message</label
            ><textarea
              id="contactMessage"
              class="form-control"
              rows="4"
              required
            ></textarea>
          </div>
          <button class="btn btn-danger">Send Message</button>
          <p class="mt-3" id="contactStatus" role="status"></p>
        </form>
      </section>
    </main>
    <footer class="bg-black text-center py-4 mt-5">
      <div class="container">
        <p class="mb-1">© 2026 Car Zone.</p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
